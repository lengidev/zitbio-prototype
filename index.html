<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioMonitor - Login</title>
    <!-- Font -->
    <link href="https://cdn.fontsource.org/fontsource/inter@5.1.2/inter.css" rel="stylesheet">
    <!-- Theme & Global Styles -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="components/ui/forms.css">
    <link rel="stylesheet" href="components/ui/buttons.css">
</head>
<body class="page-login">
    <div class="login-card">
        <div class="logo-container">
            <div class="logo-circle">
                <svg viewBox="0 0 24 24">
                    <path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.5 19 2c1 2 2 4.5 2 8 0 5.5-4.78 10-10 10Z"/>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                </svg>
            </div>
        </div>

        <h1 class="card-title">Biodiversity Monitoring System</h1>
        <p class="card-subtitle">Sign in to your account</p>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="your.email@example.com"
                    autocomplete="email"
                >
                <p class="demo-text">
                    Demo: Use any of these emails - <code>sarah.chen@biodiversity.org</code> (Admin), <code>james.wilson@biodiversity.org</code> (Officer)
                </p>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                    <button type="button" id="passwordToggleBtn" class="password-toggle" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p class="demo-text">
                    Demo: Any password works for mockup purposes
                </p>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember" class="custom-checkbox">
                <label for="remember" class="remember-label">Remember me</label>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="#" id="forgotPasswordLink" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Scripts -->
    <script src="scripts/app.js"></script>
</body>
</html>
