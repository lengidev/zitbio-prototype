<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZitBIO - Login</title>
    <link rel="icon" type="image/png" href="assets/favicon/logo-64.png">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="pages/login/login.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="page-login">
    <!-- Top-right navigation -->
    <nav class="top-nav">
        <a href="#" class="nav-link">Public Insights</a>
        <a href="#" class="nav-link">Request Access</a>
    </nav>

    <div class="login-card">
        <div class="logo-container">
            <img src="assets/logo/zitbio-logo.png" alt="ZitBIO Logo">
        </div>

        <h1 class="card-title">ZitBIO</h1>
        <p class="card-subtitle">Sign in to your account</p>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="your.email@example.com"
                    autocomplete="email"
                >
                <p class="helper-text">
Demo: Use any of these emails — <code>lenganji@zitbio.org</code> (Admin), <code>wangu@zitbio.org</code> (Officer)
                </p>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                    <button type="button" id="passwordToggleBtn" class="password-toggle" aria-label="Toggle password visibility">
                        <span id="eyeIcon" class="material-icons">visibility</span>
                    </button>
                </div>
                <p class="helper-text">
                    Demo: Any password works for mockup purposes
                </p>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember" class="custom-checkbox">
                <label for="remember" class="remember-label">Remember me</label>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="#" id="forgotPasswordLink" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Scripts -->
    <script src="lib/data.js"></script>
    <script src="pages/login/login.js"></script>
</body>
</html>
