<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZitBIO - Login</title>
    <link rel="icon" type="image/png" href="assets/favicon/logo-64.png">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/pages/login.css">
</head>
<body class="page-login">
    <!-- Back to home link -->
    <a href="#" class="back-link" id="backLink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to home
    </a>

    <div class="login-card">
        <div class="logo-container">
            <img src="assets/logo/zitbio-logo.png" alt="ZitBIO Logo">
        </div>

        <h1 class="card-title">ZitBIO</h1>
        <p class="card-subtitle">Sign in to your account</p>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="your.email@example.com"
                    autocomplete="email"
                >
                <p class="helper-text">
                    Demo: Use any of these emails — <code>sarah.chen@biodiversity.org</code> (Admin), <code>james.wilson@biodiversity.org</code> (Officer)
                </p>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                    <button type="button" id="passwordToggleBtn" class="password-toggle" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p class="helper-text">
                    Demo: Any password works for mockup purposes
                </p>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember" class="custom-checkbox">
                <label for="remember" class="remember-label">Remember me</label>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="#" id="forgotPasswordLink" class="forgot-password">Forgot password?</a>
    </div>

    <!-- Scripts -->
    <script src="scripts/data.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
